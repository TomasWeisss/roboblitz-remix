; Settings for the RoboBlitz Remix d3d9.dll proxy. Changes apply on the next game start.
; The proxy writes its log to roboblitz_remix_proxy.log in this folder.
[Proxy]
; The real d3d9.dll (the RTX Remix bridge), renamed. If it is missing, the system d3d9 is used.
RemixDll=d3d9_remix.dll

; Skip full-screen passes (post-processing, gamma, fog). They only process the game's own
; lighting, and the final gamma pass would paint that image over Remix's output.
SkipScreenPasses=1

; Skip shadow-map rendering; Remix ray traces its own shadows.
SkipShadowPasses=1

; Skip depth-only passes (depth prepass, velocity). UE3 draws the prepass with colour writes on,
; so Remix would get every mesh a second time without textures. Occlusion queries are never skipped.
SkipDepthPasses=1

; Skip the per-light additive passes. Remix lights the scene itself; these would be extra
; translucent copies of every lit mesh.
SkipLightPasses=1

; Remix uses whatever texture is in sampler stage 0 as albedo, which for UE3 materials is often
; the normal map or the lightmap. 1: before each 3D draw, put the material's albedo into stage 0:
; the first texture its diffuse expression samples (emissive for unlit materials), else the first
; texture of its opacity (mask) for translucent and masked materials, else a 1x1 texture of its
; colour. The proxy reads these expressions as the game compiles its shaders and keeps them in
; roboblitz_remix_materials.txt; shaders missing from that file keep stage 0 as the game set it. Delete RoboGame\Content\LocalShaderCache.upk to rebuild the file.
FixAlbedo=1

; 1: read each dynamic light from the light passes (position, radius, colour, spot cone) and
; hand it to Remix as a D3D9 light. Brightness overall: rtx.lightConversionIntensityFactor.
TranslateLights=1

; 0: give Remix world-space geometry (WORLD = identity).
; 1: give Remix each object's LocalToWorld matrix as the WORLD transform.
UseLocalToWorld=1

; Log every vertex shader's constants as it is created.
LogShaders=0

; Log every draw of one frame (render target, shader kind, skipped or not) after this frame
; number; 0 = off. Ctrl+F11 in game dumps the next frame at any time. Ctrl+F10 logs a one-line
; summary of each of the last 600 frames, for glitches that are over before you can press a key.
DumpFrame=300

; 1: keep a copy of every texture the game uploads (costs as much memory as its textures), so that
; Ctrl+F9 can dump the materials of the next frame: shader, material code, bound textures (as DDS),
; constants and what Remix gets in stage 0. Written to roboblitz_remix_material_dumps\ in this
; folder. Take a Remix capture at the same spot to match the dump against.
MaterialDump=1
