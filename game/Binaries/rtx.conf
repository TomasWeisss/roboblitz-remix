# Unreal Engine world space: Z up, left-handed (X forward, Y right)
rtx.zUp = True
rtx.leftHandedCoordinateSystem = True

# UE3 draws everything with vertex shaders. The d3d9 proxy supplies the fixed-function
# transforms (camera) that vertex capture needs.
rtx.useVertexCapture = True

# The patched base pass / translucency vertex shaders output the vertex normal as NORMAL0
# (shaders/patches/remix-vertex-normals.patch); vertex capture reads it from there.
rtx.useVertexCapturedNormals = True

# The proxy gives HUD draws an identity (orthographic) projection
rtx.orthographicIsUI = True

rtx.useWorldMatricesForShaders = True

# UE3 stops drawing meshes outside the view frustum, and Remix drops them, along with lights a
# replacement attaches to them (the floodlights). Anti-culling keeps instances that left the
# frustum alive until their spot comes back into view. Not active in Remix's free camera.
rtx.antiCulling.object.enable = True

