# Unreal Engine world space: Z up, left-handed (X forward, Y right)
rtx.zUp = True
rtx.leftHandedCoordinateSystem = True

# UE3 draws everything with vertex shaders. The d3d9 proxy supplies the fixed-function
# transforms (camera) that vertex capture needs.
rtx.useVertexCapture = True

# The proxy gives HUD draws an identity (orthographic) projection
rtx.orthographicIsUI = True

rtx.useWorldMatricesForShaders = True

